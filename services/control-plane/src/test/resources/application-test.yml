spring:
  datasource:
    url: jdbc:h2:mem:opspilot_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

opspilot:
  jwt:
    secret: test_secret_key_at_least_256_bits_long_for_hmac_sha256_algorithm_testing_only
    expiration-ms: 3600000
  outbox:
    enabled: false
  kafka:
    consumer:
      enabled: false
